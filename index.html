<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASAMH — Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <a href="index.html" class="logo">
            AS<span>AMH</span>
        </a>

        <a
            href="index.html"
            class="btn"
        >
            ← Back to ASAMH
        </a>

    </header>


    <main style="
        margin-left:0;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
    ">

        <div class="modal-box" style="
            width:min(450px, 95%);
        ">

            <div style="
                text-align:center;
                margin-bottom:25px;
            ">

                <div style="
                    font-size:55px;
                ">
                    🎮
                </div>

                <h1>
                    Welcome to ASAMH
                </h1>

                <p class="muted">
                    Log in or create your account.
                </p>

            </div>



          


            <!-- REGISTER -->

            <div
                id="registerSection"
                style="display:none;"
            >

                <h2>
                    Create Account
                </h2>

                <input
                    id="registerUsername"
                    class="input"
                    type="text"
                    placeholder="Choose username"
                >

                <input
                    id="registerPassword"
                    class="input"
                    type="password"
                    placeholder="Choose password"
                >

                <button
                    class="btn primary"
                    style="width:100%;"
                    onclick="registerUser()"
                >
                    🚀 Create Account
                </button>

                <p
                    id="registerMessage"
                    style="
                        margin-top:12px;
                        color:#ff718d;
                    "
                ></p>

                <button
                    class="view-all"
                    style="
                        margin-top:15px;
                    "
                    onclick="showLogin()"
                >
                    Already have an account?
                    Login
                </button>

            </div>

        </div>

    </main>


    <script src="login.js"></script>

</body>

</html>
